<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Text Cleaner AI</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: Segoe UI, Arial, sans-serif;
      padding: 16px;
      color: #1a1a1a;
    }
    h3 {
      margin-top: 0;
    }
    button {
      background: #185abd;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }
    button:hover {
      background: #0f3d80;
    }
    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #444;
    }
    .hint {
      font-size: 12px;
      color: #666;
      margin-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h3>Text Cleaner AI</h3>
  <p style="font-size:13px;">Select the messy pasted text in your document, then click below.</p>
  <button id="cleanBtn">Fix Selected Text</button>
  <button id="translateBtn">Translate to Telugu</button>
  <p id="status"></p>
  <p class="hint">This merges broken PDF line-breaks into proper paragraphs, fixes joined words, and keeps your original wording unchanged.</p>

  <script>
    const BACKEND_URL = "https://word-text-cleaner-ai.onrender.com/clean";
    const TRANSLATE_URL = "https://word-text-cleaner-ai.onrender.com/translate";

    Office.onReady(() => {
      document.getElementById("cleanBtn").onclick = cleanText;
      document.getElementById("translateBtn").onclick = translateText;
    });

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function cleanText() {
      const btn = document.getElementById("cleanBtn");
      const status = document.getElementById("status");
      btn.disabled = true;
      status.innerText = "Reading selection...";

      try {
        await Word.run(async (context) => {
          const range = context.document.getSelection();
          range.load("text");
          await context.sync();

          const original = range.text;
          if (!original || !original.trim()) {
            status.innerText = "Please select some text first.";
            btn.disabled = false;
            return;
          }

          status.innerText = "Cleaning with AI...";

          const res = await fetch(BACKEND_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: original })
          });

          if (!res.ok) {
            throw new Error("Backend request failed: " + res.status);
          }

          const data = await res.json();
          if (!data.cleaned) {
            throw new Error("No cleaned text returned.");
          }

          const indent = "&nbsp;".repeat(5);
          const cleanedParagraphs = data.cleaned
            .split(/\n{2,}/)
            .map(p => p.trim())
            .filter(p => p.length > 0);

          let html = "";
          cleanedParagraphs.forEach(p => {
            html += `<p lang="zxx" style="mso-ansi-language:zxx;mso-fareast-language:zxx;mso-bidi-language:zxx">${indent}${escapeHtml(p)}</p>`;
          });

          range.insertHtml(html, Word.InsertLocation.replace);
          await context.sync();
          status.innerText = "Done! Text cleaned.";
        });
      } catch (err) {
        console.error(err);
        status.innerText = "Error: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }

        async function translateText() {
      const btn = document.getElementById("translateBtn");
      const status = document.getElementById("status");
      btn.disabled = true;
      status.innerText = "Reading selection...";

      try {
        await Word.run(async (context) => {
          const range = context.document.getSelection();
          const wordParagraphs = range.paragraphs;
          wordParagraphs.load("text");
          await context.sync();

          const paragraphs = wordParagraphs.items
            .map(p => p.text.trim())
            .filter(p => p.length > 0);

          if (paragraphs.length === 0) {
            status.innerText = "Please select some text first.";
            btn.disabled = false;
            return;
          }

          status.innerText = "Translating with AI...";

          const res = await fetch(TRANSLATE_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: paragraphs.join("\n\n") })
          });

          if (!res.ok) {
            throw new Error("Backend request failed: " + res.status);
          }

          const data = await res.json();
          if (!data.translated) {
            throw new Error("No translation returned.");
          }

          const teluguParagraphs = data.translated
            .split(/\n{2,}/)
            .map(p => p.trim())
            .filter(p => p.length > 0);

                    const indent = "&nbsp;".repeat(5);
          let html = "";
          for (let i = 0; i < paragraphs.length; i++) {
            html += `<p lang="zxx" style="mso-ansi-language:zxx;mso-fareast-language:zxx;mso-bidi-language:zxx">${indent}${escapeHtml(paragraphs[i])}</p>`;
            if (teluguParagraphs[i]) {
              html += `<p lang="zxx" style="mso-ansi-language:zxx;mso-fareast-language:zxx;mso-bidi-language:zxx">${indent}${escapeHtml(teluguParagraphs[i])}</p>`;
            }
          }
          range.insertHtml(html, Word.InsertLocation.replace);
          await context.sync();
          status.innerText = "Done! Bilingual text inserted.";
        });
      } catch (err) {
        console.error(err);
        status.innerText = "Error: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
